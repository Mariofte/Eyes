[package]
name = "eyes"
version = "0.1.0"
description = "Eyes - scraping y análisis de redes"
authors = ["Mar"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.77.2"
publish = false
default-run = "eyes"

[lib]
name = "eyes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2.6.0"
tauri-plugin-http = "2"
tauri-plugin-log = "2"

# Añadir cuando se implemente el sidecar (ver D-003 y Sprint 0):
# tauri-plugin-shell = "2"

# Añadir cuando se genere el token de sesión (ver D-005):
# rand = "0.9"

# Añadir al decidir la persistencia (ver D-012):
# tauri-plugin-sql = { version = "2", features = ["sqlite"] }

[profile.release]
opt-level = "s"
debug = false
strip = true
debug-assertions = false
overflow-checks = false
lto = true
panic = "unwind"
incremental = false
codegen-units = 1
rpath = false
